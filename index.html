<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>wavecraft — Gerstner denizi</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #gl { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #gl:active { cursor: grabbing; }
  .hud { position: fixed; color: #cfe3ff; text-shadow: 0 1px 3px rgba(0,0,0,.85);
         user-select: none; pointer-events: none; z-index: 2; }
  #info { top: 14px; left: 16px; font-size: 12px; line-height: 1.8; opacity: .88; }
  #info b { color: #ffd27f; }
  #presets { bottom: 18px; left: 50%; transform: translateX(-50%);
             display: flex; gap: 8px; pointer-events: auto; z-index: 3;
             flex-wrap: wrap; justify-content: center; }
  #presets button { background: rgba(10,18,32,.72); color: #cfe3ff;
    border: 1px solid rgba(140,180,255,.35); border-radius: 20px;
    padding: 8px 16px; font: inherit; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(6px); transition: .15s; }
  #presets button:hover { background: rgba(30,52,90,.9); border-color: #ffd27f; }
  #presets button.on { background: rgba(255,210,127,.15); border-color: #ffd27f;
                      color: #ffe3ae; }
  #hint { bottom: 18px; right: 16px; font-size: 11px; opacity: .55; }
  #title { top: 14px; right: 16px; font-size: 12px; opacity: .7; text-align: right;
           line-height: 1.7; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud" id="info">
  <div><b>wavecraft</b> — Gerstner denizi · <span id="fps">–</span> fps</div>
  <div id="stat">–</div>
  <div>sürükle: yön · tekerlek/oklar: hız · tık: ses</div>
</div>
<div class="hud" id="title">
  ω = √(g·k) dispersiyon<br>ses: dalga tepelerinden sentezlenir
</div>
<div class="hud" id="presets"></div>
<div class="hud" id="hint">ses: <span id="sesDurum">kapalı — tıkla</span></div>

<script>
'use strict';
// =====================================================================
// wavecraft — tarayıcıda gerçek zamanlı Gerstner okyanus.
// Fizik ocean-cinema ile aynı:  ω = √(g·k),  y = Σ A·sin(k·d̂·p − ωt + φ)
// Choppiness: tepe yatay kayması.  Ses: tepelerden filtrelenmiş gürültü.
// =====================================================================

const G = 9.81;
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2rem">' +
  'Bu demo WebGL2 gerektiriyor.</p>'; throw new Error('webgl2 yok'); }

// ---------------------------------------------------------------- shader
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 a_grid;   // x: -1..1 yanal, z: 0..1 derinlik
uniform mat4  u_vp;                  // view-projection
uniform float u_time, u_chop, u_amp, u_wind;
uniform vec2  u_dir;
const int N = 5;
uniform vec4  u_waveA[N];            // k, omega, dirX, dirZ
uniform vec4  u_waveB[N];            // A, steep, phase, -
out vec3 v_world; out vec3 v_normal; out float v_crest; out float v_dist;

void main(){
  // sözde-perspektif ızgara: uzak şeritler açılır (ufka sıkışır)
  float d2 = a_grid.y * a_grid.y;
  float z  = 2.0 + d2 * 620.0;                  // dünya Z (derinlik)
  float x  = a_grid.x * (4.0 + d2 * 300.0);     // yanal genişlik

  vec2 p = vec2(x, z);
  vec2 disp = vec2(0.0), deriv = vec2(0.0);
  float y = 0.0, crest = 0.0;
  for (int i = 0; i < N; i++){
    float k = u_waveA[i].x, om = u_waveA[i].y * u_wind;
    vec2  wi = u_waveA[i].zw;
    float A = u_waveB[i].x, stp = u_waveB[i].y, ph = u_waveB[i].z;
    float f = k * dot(wi, p) - om * u_time + ph;
    float sf = sin(f), cf = cos(f);
    y     += A * sf;
    crest += A * sf;
    disp  -= u_chop * stp * cf * wi;
    deriv.x += A * k * wi.x * cf;
    deriv.y += A * k * wi.y * cf;
  }
  p += disp * u_amp;
  y *= u_amp;

  v_world  = vec3(p.x, y, p.y);
  v_normal = normalize(vec3(-deriv.x * u_amp, 1.0, -deriv.y * u_amp));
  v_crest  = crest;
  v_dist   = a_grid.y;
  gl_Position = u_vp * vec4(v_world, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec3 v_world; in vec3 v_normal; in float v_crest; in float v_dist;
uniform vec3 u_cam, u_sun, u_skyTop, u_skyHorizon, u_water;
uniform float u_time;
out vec4 frag;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

void main(){
  vec3 V = normalize(u_cam - v_world);
  vec3 N = normalize(v_normal);
  float fres = mix(0.03, 1.0, pow(1.0 - max(dot(N, V), 0.0), 4.0));

  vec3 R = reflect(-V, N);
  vec3 sky = mix(u_skyHorizon, u_skyTop, clamp(R.y * 1.4, 0.0, 1.0));

  vec3 L = normalize(u_sun);
  vec3 H = normalize(L + V);
  float spec  = pow(max(dot(N, H), 0.0), 240.0) * 2.6;
  float spark = step(0.9965, hash(floor(v_world.xz * 2.2) + floor(u_time * 9.0))) * 0.35;

  vec3 col = mix(u_water, sky, fres);
  col += vec3(1.0, 0.92, 0.76) * (spec + spark) * max(0.0, dot(N, L) * 0.5 + 0.5);
  col = mix(col, vec3(0.9, 0.94, 0.98), smoothstep(0.55, 1.5, v_crest) * 0.22);
  col = mix(col, u_skyHorizon, smoothstep(0.35, 1.0, v_dist) * 0.85);
  frag = vec4(pow(col, vec3(0.4545)), 1.0);
}`;

function derle(tip, src){
  const s = gl.createShader(tip);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, derle(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, derle(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error('link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);

// ---------------------------------------------------------------- ızgara
const NXD = 200, NZD = 170;
const verts = new Float32Array(NXD * NZD * 2);
{ let v = 0;
  for (let j = 0; j < NZD; j++)
    for (let i = 0; i < NXD; i++){
      verts[v++] = i / (NXD - 1) * 2 - 1;
      verts[v++] = j / (NZD - 1);
    } }
const idx = new Uint32Array((NXD - 1) * (NZD - 1) * 6);
{ let e = 0;
  for (let j = 0; j < NZD - 1; j++)
    for (let i = 0; i < NXD - 1; i++){
      const a = j * NXD + i, b = a + 1, c = a + NXD, dd = c + 1;
      idx[e++] = a; idx[e++] = c; idx[e++] = b;
      idx[e++] = b; idx[e++] = c; idx[e++] = dd;
    } }
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ebo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
gl.bindVertexArray(null);

// ---------------------------------------------------------------- matrisler
function persp(fovYdeg, aspect, near, far){
  const f = 1 / Math.tan(fovYdeg * Math.PI / 360);
  const nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0]);
}
function lookAt(eye, at, up){
  const zx = eye[0]-at[0], zy = eye[1]-at[1], zz = eye[2]-at[2];
  let l = Math.hypot(zx, zy, zz); const z = [zx/l, zy/l, zz/l];
  const x = [up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]];
  l = Math.hypot(...x) || 1; const xx = [x[0]/l, x[1]/l, x[2]/l];
  const y = [z[1]*xx[2]-z[2]*xx[1], z[2]*xx[0]-z[0]*xx[2], z[0]*xx[1]-z[1]*xx[0]];
  return new Float32Array([
    xx[0], y[0], z[0], 0,
    xx[1], y[1], z[1], 0,
    xx[2], y[2], z[2], 0,
    -(xx[0]*eye[0]+xx[1]*eye[1]+xx[2]*eye[2]),
    -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
    -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1]);
}
function carp(a, b){
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++){
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    o[c*4+r] = s;
  }
  return o;
}
const KAM = [0, 4.6, -11];

// ---------------------------------------------------------------- preset'ler
const PRESETS = {
  'sakin':     {dir:  25, amp: 0.30, chop: 0.30, wind: 0.7,
                top:[0.10,0.30,0.58], hor:[0.50,0.66,0.78], su:[0.02,0.10,0.16],
                suAci: 0.9},
  'firtina':   {dir: 205, amp: 1.05, chop: 0.95, wind: 1.9,
                top:[0.04,0.06,0.10], hor:[0.15,0.18,0.23], su:[0.015,0.04,0.07],
                suAci: 0.7},
  'gunbatimi': {dir: 250, amp: 0.52, chop: 0.50, wind: 0.9,
                top:[0.22,0.11,0.32], hor:[0.98,0.42,0.22], su:[0.10,0.05,0.12],
                suAci: 0.25},
  'ay':        {dir:   0, amp: 0.26, chop: 0.38, wind: 0.6,
                top:[0.005,0.01,0.04], hor:[0.05,0.09,0.20], su:[0.008,0.02,0.06],
                suAci: 1.25},
  'cak':       {dir: 140, amp: 0.80, chop: 0.78, wind: 1.35,
                top:[0.25,0.36,0.52], hor:[0.78,0.86,0.93], su:[0.06,0.18,0.26],
                suAci: 1.05},
};
let aktif = 'firtina';
let P = { ...PRESETS[aktif] };
let yon = P.dir * Math.PI / 180;
let hizCarpan = 1.0;

const PRESET_BTN = document.getElementById('presets');
for (const k of Object.keys(PRESETS)){
  const b = document.createElement('button');
  b.textContent = k;
  if (k === aktif) b.classList.add('on');
  b.addEventListener('click', () => {
    aktif = k; P = { ...PRESETS[k] }; yon = P.dir * Math.PI / 180;
    [...PRESET_BTN.children].forEach(c => c.classList.remove('on'));
    b.classList.add('on');
  });
  PRESET_BTN.appendChild(b);
}

// ---------------------------------------------------------------- etkileşim
let suruklu = false, sonX = 0;
canvas.addEventListener('pointerdown', e => {
  suruklu = true; sonX = e.clientX; sesAc();
});
addEventListener('pointerup', () => suruklu = false);
addEventListener('pointermove', e => {
  if (!suruklu) return;
  yon += (e.clientX - sonX) * 0.006;
  sonX = e.clientX;
});
addEventListener('wheel', e => {
  hizCarpan = Math.max(0.2, Math.min(3.2, hizCarpan * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  yon -= 0.12;
  if (e.key === 'ArrowRight') yon += 0.12;
  if (e.key === 'ArrowUp')    hizCarpan = Math.min(3.2, hizCarpan * 1.15);
  if (e.key === 'ArrowDown')  hizCarpan = Math.max(0.2, hizCarpan / 1.15);
});

// ---------------------------------------------------------------- ses
let ac = null, kazanc = null, filtre = null, sesKapali = true;
function sesAc(){
  if (ac){ ac.resume(); sesKapali = false; return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  const n = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const veri = buf.getChannelData(0);
  let son = 0;
  for (let i = 0; i < n; i++){
    const beyaz = Math.random() * 2 - 1;
    son = 0.965 * son + 0.035 * beyaz;
    veri[i] = (beyaz * 0.5 + son * 1.7) * 0.65;
  }
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  filtre = ac.createBiquadFilter();
  filtre.type = 'lowpass'; filtre.frequency.value = 600; filtre.Q.value = 0.6;
  const sici = ac.createBiquadFilter();
  sici.type = 'bandpass'; sici.frequency.value = 2100; sici.Q.value = 0.5;
  const siciK = ac.createGain(); siciK.gain.value = 0.10;
  kazanc = ac.createGain(); kazanc.gain.value = 0.0;
  src.connect(filtre).connect(kazanc).connect(ac.destination);
  src.connect(sici).connect(siciK).connect(ac.destination);
  src.start();
  sesKapali = false;
  document.getElementById('sesDurum').textContent = 'açık';
}

// ---------------------------------------------------------------- dalgalar
const TABAN = [
  { lam: 36,  sap:  0.00 },
  { lam: 20,  sap:  0.16 },
  { lam: 10.5, sap: -0.20 },
  { lam: 5.6, sap:  0.32 },
  { lam: 2.9, sap: -0.40 },
];
const A4 = new Float32Array(20), B4 = new Float32Array(20);
function dalgalariHesapla(yonRad, P){
  TABAN.forEach((t, i) => {
    const k = 2 * Math.PI / t.lam;
    const om = Math.sqrt(G * k);
    const aci = yonRad + t.sap;
    A4[i*4] = k; A4[i*4+1] = om;
    A4[i*4+2] = Math.cos(aci); A4[i*4+3] = Math.sin(aci);
    B4[i*4] = P.amp * (1.0 - i * 0.16);        // uzundan kısaya genlik
    B4[i*4+1] = 0.55 / (k * 5);               // steepness
    B4[i*4+2] = i * 2.17;                      // faz
  });
  return { amax: B4[0] };
}

// ---------------------------------------------------------------- döngü
function boyutla(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, innerWidth * dpr);
  canvas.height = Math.max(1, innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', boyutla); boyutla();

const baslangic = performance.now();
let sonKare = baslangic, tepeOrt = 0, fpsOrt = 60;
function kare(simdi){
  const t = (simdi - baslangic) / 1000;
  dalgalariHesapla(yon, P);

  const proj = persp(62, canvas.width / canvas.height, 0.1, 2000);
  const view = lookAt(KAM, [0, 1.4, 120], [0, 1, 0]);
  const vp = carp(proj, view);

  gl.uniformMatrix4fv(U('u_vp'), false, vp);
  gl.uniform1f(U('u_time'), t);
  gl.uniform1f(U('u_amp'), 1.0);
  gl.uniform1f(U('u_chop'), P.chop);
  gl.uniform1f(U('u_wind'), P.wind * hizCarpan);
  gl.uniform2f(U('u_dir'), Math.cos(yon), Math.sin(yon));
  gl.uniform4fv(U('u_waveA[0]'), A4);
  gl.uniform4fv(U('u_waveB[0]'), B4);
  gl.uniform3f(U('u_cam'), KAM[0], KAM[1], KAM[2]);
  const sa = yon + P.suAci, se = 0.30;
  gl.uniform3f(U('u_sun'), Math.cos(se)*Math.cos(sa), Math.sin(se),
               Math.cos(se)*Math.sin(sa));
  gl.uniform3fv(U('u_skyTop'), P.top);
  gl.uniform3fv(U('u_skyHorizon'), P.hor);
  gl.uniform3fv(U('u_water'), P.su);

  gl.bindVertexArray(vao);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);

  // ses: ortalama tepe yüksekliği → kazanç + filtre kesimi
  tepeOrt += (Math.abs(B4[0]) - tepeOrt) * 0.05;
  if (ac && kazanc){
    const hedef = Math.min(0.5, 0.05 + tepeOrt * 0.5);
    kazanc.gain.value += (hedef - kazanc.gain.value) * 0.07;
    filtre.frequency.value = 350 + tepeOrt * 850;
  }

  if (simdi - sonKare > 400){
    fpsOrt = fpsOrt * 0.5 + (1000 / (simdi - sonKare) * 4) * 0.5;
    document.getElementById('fps').textContent = Math.round(fpsOrt);
    document.getElementById('stat').textContent =
      `5 dalga · tepe ${Math.abs(B4[0]).toFixed(2)} m · hız ${(P.wind*hizCarpan).toFixed(1)}×`;
    sonKare = simdi;
  }
  requestAnimationFrame(kare);
}
requestAnimationFrame(kare);
</script>
</body>
</html>
